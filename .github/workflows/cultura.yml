name: cultura

on:
  schedule:           # UTC (BRT = UTC-3)
    # 10:00 🎨 pintura do dia: desligada em 10/10/2026 (token antigo inválido;
    # a pintura agora sai pelo repositório diario-cultural)
    - cron: "30 23 * * *"   # 20:30 🎼 obra musical do dia
  workflow_dispatch:
    inputs:
      tipo:
        description: "O que enviar agora"
        type: choice
        default: musica
        options: [pintura, musica]

permissions:
  contents: write

concurrency:
  group: jornal-state
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-24.04
    env:
      # música do dia: tópico 🎨 Diário cultural (CULTURA_THREAD_ID); sem ele, o tópico Idiomas
      TELEGRAM_THREAD_ID: ${{ vars.CULTURA_THREAD_ID || vars.TELEGRAM_THREAD_ID }}
      TELEGRAM_AVISOS_THREAD_ID: ${{ vars.TELEGRAM_AVISOS_THREAD_ID }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: enviar
        shell: bash
        env:
          TIPO: ${{ inputs.tipo || 'musica' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINTURA_TELEGRAM_TOKEN: ${{ secrets.PINTURA_TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python cultura/cultura.py 2>&1 | tee run.log

      - name: salvar estado
        if: always()
        run: |
          git config user.name "cultura-bot"
          git config user.email "cultura-bot@users.noreply.github.com"
          [ -f cultura/state.json ] && git add cultura/state.json
          git diff --staged --quiet && exit 0
          git commit -m "cultura $(date -u +%FT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Avisar falha (topico Avisos)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 avisos.py "${{ github.workflow }}" "${{ job.status }}"
