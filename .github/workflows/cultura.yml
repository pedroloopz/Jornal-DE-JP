name: cultura

on:
  schedule:           # UTC (BRT = UTC-3)
    - cron: "0 13 * * *"    # 10:00 🎨 pintura do dia
    - cron: "30 23 * * *"   # 20:30 🎼 obra musical do dia
  workflow_dispatch:
    inputs:
      tipo:
        description: "O que enviar agora"
        type: choice
        default: pintura
        options: [pintura, musica]

permissions:
  contents: write

concurrency:
  group: jornal-state
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: enviar
        shell: bash
        env:
          TIPO: ${{ inputs.tipo || (github.event.schedule == '0 13 * * *' && 'pintura' || 'musica') }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python cultura/cultura.py 2>&1 | tee run.log

      - name: salvar estado
        if: always()
        run: |
          git config user.name "cultura-bot"
          git config user.email "cultura-bot@users.noreply.github.com"
          [ -f cultura/state.json ] && git add cultura/state.json
          git diff --staged --quiet && exit 0
          git commit -m "cultura $(date -u +%FT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Avisar falha no Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERRO=$(tail -n 15 run.log 2>/dev/null | cut -c1-200 | tail -c 1500)
          echo "::error title=cultura::$(echo "$ERRO" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ O diário cultural FALHOU.
          ${ERRO:-sem detalhes no log}
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
