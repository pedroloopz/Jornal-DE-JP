name: respostas

# Lê o chat de hora em hora (07:15–23:15 BRT) e responde:
# correções de frase, avaliação de voz, confirmações e "resumo".
on:
  schedule:
    - cron: "15 10-23 * * *"
    - cron: "15 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jornal-state
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: dependências
        run: |
          pip install -r requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: responder
        env:
          MODO: respostas
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        shell: bash
        run: python send.py 2>&1 | tee run.log

      - name: salvar estado
        if: always()
        run: |
          git config user.name "jornal-bot"
          git config user.email "jornal-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet && exit 0
          git commit -m "respostas $(date -u +%FT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Avisar falha no Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERRO=$(tail -n 15 run.log 2>/dev/null | cut -c1-200 | tail -c 1500)
          # erro visivel no resumo da execucao (e legivel pela API do GitHub)
          echo "::error title=respostas::$(echo "$ERRO" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ As respostas do jornal FALHARAM.
          ${ERRO:-sem detalhes no log}
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
