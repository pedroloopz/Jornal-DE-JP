name: respostas

# Lê o chat de hora em hora (07:15–23:15 BRT) e responde:
# correções de frase, avaliação de voz, confirmações e "resumo".
on:
  schedule:
    - cron: "15 10-23 * * *"
    - cron: "15 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jornal-state
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: dependências
        run: |
          pip install -r requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: responder
        env:
          MODO: respostas
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python send.py

      - name: salvar estado
        if: always()
        run: |
          git config user.name "jornal-bot"
          git config user.email "jornal-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet && exit 0
          git commit -m "respostas $(date -u +%FT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
