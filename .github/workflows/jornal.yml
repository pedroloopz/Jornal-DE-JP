name: jornal

on:
  schedule:
    - cron: "33 10 * * *"
    - cron: "3 12 * * *"
    - cron: "33 13 * * *"
    - cron: "3 15 * * *"
    - cron: "33 16 * * *"
    - cron: "3 18 * * *"
    - cron: "33 19 * * *"
    - cron: "3 21 * * *"
    - cron: "33 22 * * *"
    - cron: "3 0 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "hora BRT, ex. 07:30 (vazio = detectar)"
        required: false
        default: ""
      pular_audio:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: enviar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SLOT_HORA: ${{ inputs.slot }}
          PULAR_AUDIO: ${{ inputs.pular_audio }}
        run: python send.py

      - name: salvar estado
        run: |
          git config user.name "jornal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "state"
          git push

      - name: avisou se falhou
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Jornal: o job falhou. Veja Actions."
