name: jornal

on:
  schedule:            # UTC (BRT = UTC-3). Se mudar, ajuste também SLOTS/CRON_SLOT no send.py
    - cron: "33 9 * * *"    # 06:30 🇯🇵
    - cron: "3 11 * * *"    # 08:00 🇩🇪
    - cron: "33 15 * * *"   # 12:30 🇯🇵
    - cron: "33 20 * * *"   # 17:30 🇩🇪
    - cron: "33 22 * * *"   # 19:30 🇯🇵
    - cron: "3 0 * * *"     # 21:00 🇩🇪 (domingo: + resumo semanal)
  workflow_dispatch:
    inputs:
      slot:
        description: "Hora BRT do slot: 06:30, 08:00, 12:30, 17:30, 19:30 ou 21:00 (vazio = mais próximo)"
        required: false
        default: ""
      sem_audio:
        description: "Enviar sem áudio"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jornal-state
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: dependências
        run: |
          pip install -r requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: enviar
        env:
          MODO: jornal
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CRON: ${{ github.event.schedule }}
          SLOT_HORA: ${{ inputs.slot }}
          SEM_AUDIO: ${{ inputs.sem_audio }}
        shell: bash
        run: python send.py 2>&1 | tee run.log

      - name: salvar estado
        if: always()
        run: |
          git config user.name "jornal-bot"
          git config user.email "jornal-bot@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet && exit 0
          git commit -m "state $(date -u +%FT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Avisar falha no Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ERRO=$(tail -n 15 run.log 2>/dev/null | cut -c1-200 | tail -c 1500)
          # erro visivel no resumo da execucao (e legivel pela API do GitHub)
          echo "::error title=jornal::$(echo "$ERRO" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ O jornal de idiomas FALHOU.
          ${ERRO:-sem detalhes no log}
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
